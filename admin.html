<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>STORIN.4TECH — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background:var(--bg);color:var(--txt);overflow:auto;">

<div id="adminLogin">
  <div class="adm-login">
    <h2>ADMIN <span>PANEL</span></h2>
    <p>Masukkan password untuk mengakses</p>
    <div class="fld2">
      <input type="password" class="inp2" id="admPass" placeholder="Password admin">
    </div>
    <button class="btn btn-p" id="btnAdmLogin">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      <span>Masuk</span>
    </button>
  </div>
</div>

<div id="adminPanel" class="hidden" style="min-height:100vh;background:var(--bg);">
  <div class="adm-hdr">
    <h1>ADMIN <span>PANEL</span></h1>
    <button class="adm-logout" id="btnAdmOut">Keluar</button>
  </div>
  <div class="adm-body">
    <div class="adm-stats">
      <div class="adm-stat"><div class="n" id="stPend">0</div><div class="l">Pending</div></div>
      <div class="adm-stat"><div class="n" id="stTotal">0</div><div class="l">Total Diproses</div></div>
    </div>
    <div class="ch" style="margin-bottom:14px">
      <button class="ch-i on" data-f="pending">Pending</button>
      <button class="ch-i" data-f="history">Riwayat Approve</button>
    </div>
    <div id="txList"></div>
  </div>
</div>

<div class="tw" id="tw"></div>
<div class="ld" id="ld"><div class="ld-s"></div><p id="ldT">Memproses</p></div>

<script src="app.js"></script>
<script>
(function(){
  var $=STORIN.$,$$=STORIN.$$;
  var currentFilter='pending';
  var cachedPending={};
  var totalProcessed=0;

  var isAuth=localStorage.getItem('storin_admin')==='1';
  if(isAuth){showPanel();}

  function showPanel(){
    $('adminLogin').classList.add('hidden');
    $('adminPanel').classList.remove('hidden');
    loadData();
    setInterval(loadData,15000);
  }

  $('btnAdmLogin').onclick=function(){
    var p=($('admPass').value||'').trim();
    if(p!==STORIN.CONFIG.ADMIN_PASS){
      STORIN.toast('Password salah.','e');
      STORIN.vib([30,60,30]);
      return;
    }
    localStorage.setItem('storin_admin','1');
    STORIN.toast('Login berhasil.','s');
    showPanel();
  };
  $('admPass').addEventListener('keydown',function(e){if(e.key==='Enter')$('btnAdmLogin').click();});

  $('btnAdmOut').onclick=function(){
    if(!confirm('Keluar dari panel admin?'))return;
    localStorage.removeItem('storin_admin');
    location.reload();
  };

  $$('.ch-i').forEach(function(c){
    c.onclick=function(){
      $$('.ch-i').forEach(function(x){x.classList.remove('on');});
      c.classList.add('on');currentFilter=c.getAttribute('data-f');render();
    };
  });

  function loadData(){
    STORIN.getPending().then(function(list){
      cachedPending=list||{};
      $('stPend').textContent=Object.keys(cachedPending).length;
      render();
    });
  }

  function render(){
    var box=$('txList');
    if(currentFilter==='history'){
      STORIN.fbGet('users').then(function(users){
        var arr=[];
        Object.keys(users||{}).forEach(function(k){
          var u=users[k],hist=Array.isArray(u.history)?u.history:[];
          hist.forEach(function(h){
            if(h.status==='success'||h.status==='fail') arr.push({h:h,user:u});
          });
        });
        arr.sort(function(a,b){return (b.h.settledAt||b.h.time)-(a.h.settledAt||a.h.time);});
        arr=arr.slice(0,50);
        if(!arr.length){box.innerHTML='<div class="adm-empty">Belum ada transaksi diproses.</div>';return;}
        var H='';
        arr.forEach(function(it){
          var h=it.h,u=it.user,ok=h.status==='success';
          H+='<div class="tx"><div class="tx-h"><div class="tx-id">'+STORIN.esc(h.id||'-')+'</div><div class="tx-time">'+STORIN.dt(h.settledAt||h.time)+'</div></div><div class="tx-gmail">'+STORIN.esc(h.gmail||'-')+'</div><div class="tx-info"><div><span class="k">User</span><span class="v">'+STORIN.esc(u.nama||'-')+'</span></div><div><span class="k">Status</span><span class="v" style="color:'+(ok?'var(--green)':'#d18c8c')+'">'+(ok?'Sukses':'Gagal')+'</span></div></div></div>';
        });
        box.innerHTML=H;
        $('stTotal').textContent=arr.length;
      });
      return;
    }

    var keys=Object.keys(cachedPending);
    if(!keys.length){box.innerHTML='<div class="adm-empty">Tidak ada transaksi pending. 🎉</div>';return;}
    keys.sort(function(a,b){return (cachedPending[b].time||0)-(cachedPending[a].time||0);});
    var H='';
    keys.forEach(function(txId){
      var tx=cachedPending[txId];
      H+='<div class="tx" data-tx="'+txId+'">'+
        '<div class="tx-h"><div class="tx-id">'+STORIN.esc(txId)+'</div><div class="tx-time">'+STORIN.dt(tx.time||Date.now())+'</div></div>'+
        '<div class="tx-gmail">'+STORIN.esc(tx.gmail||'-')+'</div>'+
        '<div class="tx-info">'+
          '<div><span class="k">Nama</span><span class="v">'+STORIN.esc(tx.userName||'-')+'</span></div>'+
          '<div><span class="k">WhatsApp</span><span class="v">+'+STORIN.esc(tx.userWhatsapp||'-')+'</span></div>'+
          '<div><span class="k">Password</span><span class="v">'+STORIN.esc(tx.password||'-')+'</span></div>'+
          '<div><span class="k">Bayaran</span><span class="v">'+STORIN.rp(STORIN.CONFIG.PRICE)+'</span></div>'+
        '</div>'+
        '<div class="tx-btn"><button class="ok" data-act="approve" data-tx="'+txId+'">✓ Approve</button><button class="no" data-act="reject" data-tx="'+txId+'">✕ Reject</button></div>'+
      '</div>';
    });
    box.innerHTML=H;

    box.querySelectorAll('button[data-act]').forEach(function(b){
      b.onclick=function(){
        var act=b.getAttribute('data-act');
        var txId=b.getAttribute('data-tx');
        var tx=cachedPending[txId];
        if(!tx)return;
        var confirmMsg=(act==='approve')
          ? 'Approve Gmail:\n'+tx.gmail+'\n\nSaldo user akan bertambah '+STORIN.rp(STORIN.CONFIG.PRICE)+'.'
          : 'Reject Gmail:\n'+tx.gmail+'\n\nGmail akan dibalikkan ke pool.';
        if(!confirm(confirmMsg))return;
        b.disabled=true;
        STORIN.showL(act==='approve'?'Approving...':'Rejecting...');
        var fn=(act==='approve')?STORIN.approvePending:STORIN.rejectPending;
        fn(txId).then(function(){
          STORIN.hideL();
          STORIN.toast(act==='approve'?'Gmail di-approve!':'Gmail di-reject.','s');
          var notif=(act==='approve')
            ? '✅ GMAIL APPROVED\n\nUser: '+(tx.userName||'-')+'\nGmail: '+tx.gmail+'\nSaldo +'+STORIN.rp(STORIN.CONFIG.PRICE)
            : '❌ GMAIL REJECTED\n\nUser: '+(tx.userName||'-')+'\nGmail: '+tx.gmail+'\nGmail dikembalikan ke pool.';
          STORIN.tg(notif);
          loadData();
        }).catch(function(err){
          STORIN.hideL();b.disabled=false;
          STORIN.toast('Gagal: '+(err.message||'error'),'e');
        });
      };
    });
  }
})();
</script>
</body>
</html>
